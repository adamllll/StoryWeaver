# StoryWeaver CI/CD 工作流
# 触发条件：push 到 main/develop 或 PR 到 main

name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '20'

jobs:
  # ========== 后端测试 ==========
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio

      - name: Run tests with coverage
        run: |
          pytest --cov=app --cov-report=xml --cov-report=term-missing
        env:
          DATABASE_URL: sqlite:///./test.db
          JWT_SECRET_KEY: test-secret-key-for-ci
          DEBUG: true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: backend/coverage.xml
          flags: backend
          fail_ci_if_error: false

  # ========== 前端测试 ==========
  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Build application
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: frontend/coverage/lcov.info
          flags: frontend
          fail_ci_if_error: false

  # ========== Docker 构建 ==========
  build-docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: storyweaver-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: storyweaver-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ========== 部署到服务器（1Panel 环境）==========
  deploy:
    name: Deploy to Production (1Panel)
    runs-on: ubuntu-latest
    needs: build-docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            # 切换到项目目录（1Panel 默认路径）
            cd /opt/1panel/apps/storyweaver

            # 拉取最新代码
            git pull origin main

            # 使用 docker compose 重新构建并启动（1Panel 兼容）
            docker compose down
            docker compose build --no-cache
            docker compose up -d

            # 清理旧镜像节省空间
            docker image prune -af --filter "until=24h"

            # 检查容器状态
            echo "=== 容器状态 ==="
            docker compose ps

            # 检查容器日志（最后 20 行）
            echo "=== 后端日志 ==="
            docker compose logs --tail=20 backend

            echo "=== 前端日志 ==="
            docker compose logs --tail=20 frontend

            echo "✅ 部署完成于 $(date '+%Y-%m-%d %H:%M:%S')"

# ========== 配置说明 ==========
#
# 需要在 GitHub Secrets 中配置：
# - SERVER_HOST: 服务器 IP 或域名
# - SERVER_USER: SSH 用户名（通常是 root）
# - SERVER_SSH_KEY: SSH 私钥（完整内容，包括 -----BEGIN OPENSSH PRIVATE KEY-----）
# - SERVER_PORT: SSH 端口（可选，默认 22）
#
# 可选配置：
# - CODECOV_TOKEN: Codecov 上传令牌（用于私有仓库）
#
# 1Panel 环境说明：
# - 项目默认部署在 /opt/1panel/apps/storyweaver/
# - 使用 docker compose 管理容器（与 1Panel 编排兼容）
# - 自动清理 24 小时前的旧镜像
#
