name: StoryWeaver release images

on:
  push:
    branches: [maintenance/storyweaver-sqlite-release]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/storyweaver

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push backend
        id: backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-backend:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build and push frontend
        id: frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          platforms: linux/amd64
          push: true
          build-args: NODE_HEAP_MB=4096
          tags: ${{ env.IMAGE_PREFIX }}-frontend:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - name: Record digests
        run: |
          mkdir -p release-evidence
          printf 'source_sha=%s\nbackend=%s\nfrontend=%s\n' "$GITHUB_SHA" '${{ steps.backend.outputs.digest }}' '${{ steps.frontend.outputs.digest }}' | tee release-evidence/image-digests.txt
      - uses: actions/upload-artifact@v4
        with:
          name: image-digests
          path: release-evidence/image-digests.txt
